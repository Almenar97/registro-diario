<head>

<title>Registro diario</title>
<meta name="description" content="Registro diario personal de ejercicios">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F6F4EF" media="(prefers-color-scheme: light)">

<meta name="apple-mobile-web-app-capable" content="yes">

<body>
<div id="lock" class="lock" hidden>
  <div class="lock-box">
    <div class="lock-icon">🔒</div>
    <h1>Registro diario</h1>
    <form id="lock-form" autocomplete="off">
      <input id="lock-input" type="password" inputmode="numeric" pattern="[0-9]*" placeholder="PIN" aria-label="PIN" maxlength="8">
      <button class="btn primary" type="submit">Desbloquear</button>
      <p id="lock-error" class="lock-error" role="alert"></p>
    </form>
  </div>
</div>

<div class="app">
  <main id="view" tabindex="-1"></main>
</div>

<nav class="tabbar" aria-label="Secciones">

  <a href="#/ajustes" data-tab="ajustes"><span class="ti">⚙️</span><span>Ajustes</span></a>
</nav>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
